name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux proves the platform-neutral projects stay platform-neutral (ADR-0004). The WPF Studio (ADR-0018) is
        # compiled on Linux (EnableWindowsTargeting) and tested on Windows only.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MyRPA.sln

      - name: Verify formatting and code style
        run: dotnet format MyRPA.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build MyRPA.sln --configuration Release --no-restore

      # ADR-0017: Playwright 1.63.0 needs Chromium 153 / headless shell (revision 1243). The installer ships in the plugin's
      # build output. Linux also needs the browser's system libraries (--with-deps). Tests never download browsers.
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./plugins/MyRPA.Browser.Playwright/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Install Playwright Chromium and system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./plugins/MyRPA.Browser.Playwright/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test (unit, integration, architecture, browser; Studio window tests on Windows)
        run: dotnet test --solution MyRPA.sln --configuration Release --no-build

      - name: CLI smoke test
        run: |
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- info
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- validate samples/control-flow.json
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- run samples/hello-world.json --arg userName=CI
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- --plugin samples/plugins/MyRPA.Samples.DemoPlugin/bin/Release/net10.0 plugins
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- --plugin samples/plugins/MyRPA.Samples.DemoPlugin/bin/Release/net10.0 catalog
          dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- --plugin samples/plugins/MyRPA.Samples.DemoPlugin/bin/Release/net10.0 run samples/plugins/demo-plugin.json
