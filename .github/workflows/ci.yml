name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux proves the platform-neutral projects stay platform-neutral (ADR-0004).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MyRPA.sln

      - name: Verify formatting and code style
        run: dotnet format MyRPA.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build MyRPA.sln --configuration Release --no-restore

      - name: Test (unit, integration, architecture)
        run: dotnet test --solution MyRPA.sln --configuration Release --no-build

      - name: CLI smoke test
        run: dotnet run --project src/MyRPA.Cli --configuration Release --no-build -- info
